[config]
version_check = false
caching = true
contrast = 0.0
fallback_color = '#6750a4'
prefer = 'closest-to-fallback'
source_color_index = 0

[config.custom_colors]
red = { color = '#ff5555', blend = true }
green = { color = '#50fa7b', blend = true }
yellow = { color = '#f1fa8c', blend = true }
blue = { color = '#8be9fd', blend = true }
magenta = { color = '#ff79c6', blend = true }
cyan = { color = '#8be9fd', blend = true }

[templates.palette-state]
input_path = '~/.config/matugen/templates/palette-state.json'
output_path = '~/.cache/matugen/palette.json'
index = 10000
post_hook = 'sh -c "test \"${MATUGEN_WALLPAPER_ACTIVE:-0}\" = 1 || \"$HOME/.local/bin/matugen-wallpaper\" --postprocess-only"'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
index = 50

[templates.oh-my-posh]
input_path = '~/.config/matugen/templates/oh-my-posh.json'
output_path = '~/.config/zsh/prompt.json'
index = 52

[templates.zsh-palette]
input_path = '~/.config/matugen/templates/zsh-palette.zsh'
output_path = '~/.config/matugen/runtime/zsh/prompt.zsh'
index = 53

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'
index = 55

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim.lua'
output_path = '~/.config/nvim/colors/dms.lua'
index = 9058

[templates.gnome-shell]
input_path = '~/.config/matugen/templates/gnome-shell.css'
output_path = '~/.local/share/themes/Matugen/gnome-shell/gnome-shell.css'
index = 60

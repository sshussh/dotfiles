name: reproducibility
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y stow
      - name: Syntax checks
        run: |
          python -m py_compile dotfiles scripts/export-gnome scripts/replace-existing scripts/setup-gnome-extensions
          bash -n install.sh scripts/check-deps scripts/load-gnome maintenance/check-reproducibility maintenance/install-codex maintenance/purge-sensitive-history.sh
          find state -mindepth 2 -maxdepth 2 -type f -perm -u+x -print0 | xargs -0 -r -n1 bash -n
      - name: Unit and integration tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Profile audit against an isolated home
        run: |
          target=$(mktemp -d)
          DOTFILES_TARGET="$target" ./dotfiles audit --profile workstation --skip-lock
          DOTFILES_TARGET="$target" ./dotfiles apply --profile workstation --dry-run --skip-packages --skip-system --skip-state
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

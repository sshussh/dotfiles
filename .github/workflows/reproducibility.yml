name: reproducibility
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y stow
      - name: Syntax checks
        run: |
          python -m py_compile gnome/export
          bash -n install.sh gnome/load
      - name: Stow simulate into an isolated home
        run: |
          target=$(mktemp -d)
          STOW_TARGET="$target" ./install.sh --simulate
          STOW_TARGET="$target" ./install.sh
          test -L "$target/.zshenv"
          test -L "$target/.config/zsh/.zshrc"
          test -L "$target/.config/niri/config.kdl"
          test -L "$target/.config/zed/settings.json"
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

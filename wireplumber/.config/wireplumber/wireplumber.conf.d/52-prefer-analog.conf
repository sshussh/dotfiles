# Prefer analog I/O. C-Media USB headsets advertise IEC958 without a real
# digital jack, and the onboard Realtek card was getting stuck on AC3.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-C-Media_Electronics_Inc._Redragon_Gaming_Headset_999-00" }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
      }
    }
  },
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
      }
    }
  },
  {
    matches = [
      { node.name = "alsa_input.pci-0000_00_1f.3.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-C-Media_Electronics_Inc._Redragon_Gaming_Headset_999-00" }
    ]
    actions = {
      update-props = {
        priorities = [ "output:analog-stereo+input:analog-stereo", "output:analog-stereo+input:mono-fallback", "output:analog-stereo" ]
      }
    }
  },
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        priorities = [ "output:analog-stereo", "output:analog-stereo+input:analog-stereo" ]
      }
    }
  }
]

[calculator]
base=10
button-mode='basic'
source-units=['degree']
target-units=['radian']
unit-category='angle'

[desktop/a11y/applications]
screen-magnifier-enabled=false

[desktop/a11y/interface]
high-contrast=false

[desktop/a11y/magnifier]
cross-hairs-length=58

[desktop/break-reminders/eyesight]
play-sound=true

[desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[desktop/calendar]
show-weekdate=true
week-start-day='sunday'

[desktop/datetime]
automatic-timezone=true

[desktop/input-sources]
mru-sources=[('xkb', 'us'), ('xkb', 'ara')]
show-all-sources=false
sources=[('xkb', 'us'), ('xkb', 'ara')]
xkb-options=['terminate:ctrl_alt_bksp']

[desktop/interface]
clock-format='24h'
clock-show-seconds=true
clock-show-weekday=true
toolkit-accessibility=false

[desktop/peripherals/keyboard]
numlock-state=true

[desktop/peripherals/mouse]
accel-profile='flat'

[desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[desktop/privacy]
disable-camera=true

[desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[desktop/screensaver]
lock-delay=uint32 0
lock-enabled=true

[desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Nautilus.desktop']

[desktop/session]
idle-delay=uint32 300

[desktop/sound]
event-sounds=true
theme-name='freedesktop'

[desktop/wm/keybindings]
begin-move=@as []
close=['<Super>q']
cycle-group=@as []
cycle-group-backward=@as []
cycle-panels=@as []
cycle-panels-backward=@as []
cycle-windows=@as []
cycle-windows-backward=@as []
maximize=@as []
minimize=['<Shift><Super>m']
move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []
move-to-workspace-1=['<Shift><Super>1']
move-to-workspace-2=['<Shift><Super>2']
move-to-workspace-3=['<Shift><Super>3']
move-to-workspace-4=['<Shift><Super>4']
move-to-workspace-last=@as []
move-to-workspace-left=@as []
move-to-workspace-right=@as []
switch-group=@as []
switch-group-backward=@as []
switch-panels=@as []
switch-panels-backward=@as []
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
switch-to-workspace-last=@as []
switch-to-workspace-left=@as []
switch-to-workspace-right=@as []
toggle-fullscreen=['<Alt><Super>m']
toggle-maximized=['<Super>m']
unmaximize=@as []

[desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=4
resize-with-right-button=true

[mutter]
dynamic-workspaces=false
experimental-features=@as []
focus-change-on-pointer-rest=false
overlay-key='Super'
workspaces-only-on-primary=true

[mutter/keybindings]
toggle-tiled-left=['<Super>Left']

[nautilus/compression]
default-compression-format='zip'

[nautilus/list-view]
default-column-order=['name', 'size', 'type', 'owner', 'group', 'permissions', 'date_modified', 'date_accessed', 'date_created', 'recency', 'detailed_type']
default-visible-columns=['name', 'size', 'date_modified']

[nautilus/preferences]
default-folder-viewer='list-view'
migrated-gtk-settings=true
show-create-link=true
show-delete-permanently=true
show-image-thumbnails='always'

[papers]
night-mode=false

[settings-daemon/plugins/color]
night-light-enabled=false
night-light-schedule-automatic=false

[settings-daemon/plugins/media-keys]
help=@as []
magnifier=['<Alt><Super>z']
screenreader=@as []

[settings-daemon/plugins/power]
idle-dim=false
power-button-action='suspend'
sleep-inactive-ac-type='nothing'

[shell]
enabled-extensions=['Vitals@CoreCoding.com', 'appindicatorsupport@rgcjonas.gmail.com', 'clipboard-indicator@tudmotu.com']

[shell/app-switcher]
current-workspace-only=true

[shell/extensions/vitals]
alphabetize=false
hide-zeros=false
include-static-gpu-info=true
include-static-info=true
show-battery=false
show-fan=true
show-gpu=true
show-network=true
show-system=true
use-higher-precision=false

[shell/keybindings]
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
toggle-message-tray=@as []

[tweaks]
show-extensions-notice=false
